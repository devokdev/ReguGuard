# ReguGuard Model Configuration
# Configured with Groq API Key

generator:
  provider: groq
  model: qwen/qwen3.8-27b
  temperature: 0.1
  max_output_tokens: 2048

judge:
  provider: groq
  model: qwen/qwen3.8-27b
  temperature: 0.0
  max_output_tokens: 2048

reasoning_expert:
  provider: groq
  model: openai/gpt-oss-120b
  temperature: 0.1
  max_output_tokens: 4096

embeddings:
  provider: google
  model: text-embedding-004
  dimension: 768
